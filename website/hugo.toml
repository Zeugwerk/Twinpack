# The site lives in its own folder next to index.php (the API). index.php redirects / to it.
baseURL = "https://twinpack.dev/website/"
title = "Twinpack"
enableRobotsTXT = false
disableKinds = ["taxonomy", "term", "RSS"]

[markup.goldmark.renderer]
  unsafe = true

[params]
  tagline = "The package manager for TwinCAT libraries"
  description = "Twinpack is a free, open-source package manager for TwinCAT PLC libraries. Search the catalog, pin versions and restore dependencies from the IDE, the command line or CI."

  # Base URL of the Twinpack API, without a trailing slash. On twinpack.dev the site and the
  # API share an origin, so the relative path is enough. Branch previews are built with
  # HUGO_PARAMS_APIBASE=https://twinpack.dev/index.php (see .jenkins/deploy and deploy/README.md).
  apiBase = "/index.php"

  releases = "https://github.com/Zeugwerk/Twinpack/releases/latest"
  github = "https://github.com/Zeugwerk/Twinpack"
  docs = "https://doc.zeugwerk.dev/development-tools/twinpack/overview.html"
  quickstart = "https://doc.zeugwerk.dev/development-tools/twinpack/twinpack_quickstart.html"
  registry = "https://github.com/Zeugwerk/Twinpack-Registry"
  register = "https://api.zeugwerk.dev/account/register"
  company = "https://zeugwerk.at"
  contact_email = "info@zeugwerk.at"

[menus]
  [[menus.main]]
    name = "Packages"
    url = "/packages/"
    weight = 10
  [[menus.main]]
    name = "Get started"
    url = "/#get-started"
    weight = 20
  [[menus.main]]
    name = "Publish"
    url = "/#publish"
    weight = 30
